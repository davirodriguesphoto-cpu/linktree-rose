<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rose Coutinho • Saúde &amp; Estética Avançada</title>
<meta name="description" content="Rose Coutinho, esteticista e cosmetóloga em Taubaté. Agende pelo WhatsApp, siga no Instagram e veja como chegar.">
<meta name="theme-color" content="#fdf5f5">
<meta property="og:title" content="Rose Coutinho • Saúde & Estética Avançada">
<meta property="og:description" content="Agende pelo WhatsApp, siga no Instagram e veja como chegar.">
<meta property="og:image" content="foto-rose.jpg">
<link rel="icon" href="logo-rose.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf5f5;--surface:#fffdfd;--tint:#f4dfe2;--fg:#3b2a2e;--muted:#7d6268;--line:#ecd5d9;
  --accent:#b76e79;--btn:#a85d6a;--link:#96495a;--glass:rgba(255,253,253,.72);
  --display:'Josefin Sans',sans-serif;--body:'Mulish',system-ui,sans-serif;
}
:root[data-theme=dark]{
  --bg:#2a0e18;--surface:#371420;--tint:#502034;--fg:#f8ebee;--muted:#cfa9b3;--line:#5a2a3c;
  --accent:#e7a9b4;--btn:#a8475f;--link:#f0b6c0;--glass:rgba(55,20,32,.7);
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{min-height:100dvh;background:var(--bg);color:var(--fg);font:400 16px/1.45 var(--body);
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  transition:background .3s,color .3s}
.wrap{max-width:460px;margin:0 auto;display:grid;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 2px}
header img{height:40px;display:block}
header span{width:40px}
#tema{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);
  display:grid;place-items:center;cursor:pointer;transition:transform .2s}
#tema:active{transform:scale(.92)}
#tema svg{width:18px;height:18px}
.sun{display:none}
:root[data-theme=dark] .sun{display:block}:root[data-theme=dark] .moon{display:none}

.hero{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/5;background:var(--tint);
  box-shadow:0 20px 50px -24px rgba(145,48,77,.45)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 8%}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to top,rgba(120,36,62,.96) 0%,rgba(145,48,77,.85) 28%,rgba(183,110,121,.4) 46%,rgba(183,110,121,0) 62%)}
.hero .txt{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:22px 22px 24px;color:#fff;text-align:center}
.wm{display:block;width:min(56%,210px);height:auto;margin:0 auto}
.hero p b{font-weight:600}
.hero small{display:block;margin-top:10px;font-size:13px;opacity:.9}

nav{display:grid;gap:12px}
.card{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:22px;text-decoration:none;color:var(--fg);
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 14px 30px -18px var(--accent)}
.card:active{transform:scale(.98)}
.card:focus-visible,#tema:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ico{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--link)}
.ico svg{width:22px;height:22px}
.card b{display:block;font:600 17px var(--display);letter-spacing:.04em}
.card span{display:block;font-size:13.5px;color:var(--muted)}
.card .go{margin-left:auto;flex:none;width:20px;height:20px;color:var(--accent)}
.card.main{background:var(--btn);border-color:transparent;color:#fff}
.card.main .ico{background:rgba(255,255,255,.2);color:#fff}
.card.main span{color:#fff}.card.main .go{color:#fff}
.card.main:hover{box-shadow:0 14px 30px -14px var(--btn)}
.map{width:100%;height:240px;border:1px solid var(--line);border-radius:22px;display:block}
:root[data-theme=dark] .map{filter:brightness(.85) contrast(1.05)}
footer{text-align:center;font-size:12px;color:var(--muted);padding-top:6px}

@media(min-width:900px){
  body{display:grid;align-items:center;padding:32px}
  .wrap{max-width:1000px;grid-template-columns:1fr 1fr;gap:28px 40px;align-items:center}
  header{grid-column:1/-1}
  .hero{aspect-ratio:auto;height:min(640px,calc(100dvh - 190px));min-height:480px}
  nav{align-content:center}
  footer{grid-column:1/-1}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span></span>

      <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

      <div class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-1.4-.7-2.400-1.300-3.300-2.900-.2-.3.2-.3.700-1.100.1-.2 0-.3 0-.5l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.300-.7.700-1 1.500-1 2.400.1 1 .5 2 1.100 2.800 1.300 1.700 2.600 2.700 4.600 3.500 1.500.6 2.100.4 2.800.3.800-.1 1.500-.7 1.700-1.400.2-.6.2-1.100.1-1.200-.1-.1-.2-.1-.4-.2Z"/></svg></div>
      <div><b>WhatsApp</b><span>Agende seu horário</span></div>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>

    <a class="card" href="https://www.instagram.com/dra.rosecoutinho/" target="_blank" rel="noopener">

      <div><b>Instagram</b><span>@dra.rosecoutinho</span></div>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <a class="card" href="https://share.google/3HHq0iv6xKLyRs9Wh" target="_blank" rel="noopener">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.500C5 14.800 12 21 12 21Z"/><circle cx="12" cy="9.500" r="2.500"/></svg></div>
      <div><b>Como chegar</b><span>R. Expedicionário Rubéns Leite, 34 Vila Nossa Sra. das Graças, Taubaté - SP</span></div>
      <svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <iframe class="map" title="Mapa do consultório" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
      src="https://maps.google.com/maps?q=R.+Expedicion%C3%A1rio+Rub%C3%A9ns+Leite,+34,+Taubat%C3%A9+-+SP&amp;z=16&amp;output=embed"></iframe>
  </nav>

  <footer>© 2026 Rose Coutinho • Todos os direitos reservados</footer>
</div>
<script>
(function(){
  var r=document.documentElement,m=document.querySelector('meta[name=theme-color]'),k='rose-tema';
  function set(t){r.dataset.theme=t;m.content=t==='dark'?'#2a0e18':'#fdf5f5'}
  var s;try{s=localStorage.getItem(k)}catch(e){}
  set(s||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
  document.getElementById('tema').onclick=function(){
    var t=r.dataset.theme==='dark'?'light':'dark';set(t);try{localStorage.setItem(k,t)}catch(e){}
  };
})();
</script>
</body>
</html>
